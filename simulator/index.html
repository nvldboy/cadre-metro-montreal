<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulateur du cadre du métro</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #17191a;
      --panel: #232526;
      --text: #f4f1e8;
      --muted: #a5a5a0;
      --border: #3d4041;
      --amber: #ff8a00;
      --red: #ff3347;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    main {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 20px;
    }
    header, .controls, .line-statuses {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header { justify-content: space-between; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 1.35rem; font-weight: 600; }
    .meta { color: var(--muted); font-size: .9rem; }
    button, select, .button-link {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
    }
    button, .button-link { cursor: pointer; }
    button:hover, .button-link:hover { border-color: var(--text); }
    .button-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }
    .line-statuses { margin: 14px 0; }
    .line-state {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: .86rem;
    }
    .line-state[data-severity="1"] { border-color: var(--amber); }
    .line-state[data-severity="2"] { border-color: var(--red); }
    .map-wrap {
      position: relative;
      width: min(100%, 760px);
      margin: 0 auto;
      background: #252728;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: background .5s ease, border-color .5s ease;
    }
    body.night-preview .map-wrap {
      background: #111616;
      border-color: #26302c;
    }
    svg { display: block; width: 100%; height: auto; }
    .led-socket {
      fill: #111314;
      stroke: #494c4d;
      stroke-width: .8;
    }
    .led {
      cursor: pointer;
      stroke: #f4f1e8;
      stroke-width: .7;
      transition: fill .18s ease, opacity .18s ease;
      filter: drop-shadow(0 0 2.4px currentColor);
    }
    .led.train {
      stroke-width: 1.2;
      filter:
        drop-shadow(0 0 2.5px #fff)
        drop-shadow(0 0 5px currentColor);
    }
    .led.slow { animation: pulse 1.8s ease-in-out infinite; }
    .led.stopped-line {
      fill: var(--red) !important;
      color: var(--red) !important;
      animation: double-flash 2.4s steps(1) infinite;
    }
    .led.stopped-station {
      fill: var(--red) !important;
      color: var(--red) !important;
      animation: triple-flash 2s steps(1) infinite;
    }
    @keyframes pulse { 50% { opacity: .28; } }
    @keyframes double-flash {
      0%, 7.4%, 15%, 22.4% { opacity: 1; }
      7.5%, 14.9%, 22.5%, 100% { opacity: 0; }
    }
    @keyframes triple-flash {
      0%, 6.9%, 14%, 20.9%, 28%, 34.9% { opacity: 1; }
      7%, 13.9%, 21%, 27.9%, 35%, 100% { opacity: 0; }
    }
    .detail {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--muted);
    }
    .messages {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }
    .messages:empty { display: none; }
    .messages p { margin: 5px 0; }
    @media (max-width: 620px) {
      main { padding: 12px; }
      header { align-items: flex-start; }
      .controls { width: 100%; }
      select { flex: 1; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Cadre lumineux du métro</h1>
      <div class="meta" id="meta">Chargement…</div>
    </div>
    <div class="controls">
      <label for="mode">Simulation</label>
      <select id="mode">
        <option value="live">Direct — style Metroboard</option>
        <option value="night">Mode nuit — respiration paisible</option>
        <option value="normal">Tout normal</option>
        <option value="green-stop">Interruption verte</option>
        <option value="orange-stop">Interruption orange</option>
        <option value="orange-slow">Ralentissement orange</option>
        <option value="berri-stop">Berri-UQAM fermée</option>
        <option value="orange-recovery">Reprise de la ligne orange</option>
        <option value="test">Test séquentiel</option>
        <optgroup label="Mise en marche">
          <option value="boot">Alimentation et autotest</option>
          <option value="line-test">Vérification des quatre lignes</option>
          <option value="wifi-connect">Connexion Wi-Fi</option>
          <option value="wifi-connected">Wi-Fi connecté</option>
          <option value="clock-sync">Synchronisation de l’heure</option>
          <option value="schedule-loading">Chargement de l’horaire</option>
          <option value="ready">Système prêt</option>
        </optgroup>
        <optgroup label="Erreurs et maintenance">
          <option value="config-error">Configuration invalide</option>
          <option value="wifi-unavailable">Aucun Wi-Fi accessible</option>
          <option value="wifi-reconnecting">Wi-Fi perdu</option>
          <option value="gtfs-expired">Horaire GTFS expiré</option>
          <option value="api-stale">API STM inaccessible</option>
          <option value="gtfs-updating">Mise à jour GTFS</option>
          <option value="gtfs-update-success">Mise à jour réussie</option>
          <option value="gtfs-update-error">Échec de mise à jour</option>
          <option value="power-limited">Protection électrique active</option>
          <option value="fatal-error">Erreur fatale</option>
        </optgroup>
      </select>
      <button id="refresh" type="button">Actualiser</button>
      <a class="button-link" href="/setup-preview" target="_blank"
         rel="noopener">Assistant initial</a>
    </div>
  </header>

  <div class="line-statuses" id="line-statuses"></div>

  <div class="map-wrap">
    <svg id="map" viewBox="0 0 457.2 609.6" role="img"
         aria-label="Simulation des 68 DEL de la carte du métro">
      <image href="/map.svg" x="0" y="0" width="457.2" height="609.6"></image>
      <g id="leds"></g>
    </svg>
  </div>

  <p class="detail" id="detail">Sélectionnez une station pour voir son état.</p>
  <div class="messages" id="messages"></div>
</main>

<script>
  const lineLabels = {
    green: "Verte", orange: "Orange", yellow: "Jaune", blue: "Bleue"
  };
  const stateLabels = ["normal", "ralenti", "interrompu"];
  let layout;
  let liveStatus;
  let liveTrains;
  let liveTrainAnchorMs = 0;
  let testTimer;
  let nightAnimationFrame;
  let liveAnimationFrame;
  let systemAnimationFrame;

  function emptyStatus() {
    return {
      lines: {green: 0, orange: 0, yellow: 0, blue: 0},
      stations: {}, messages: [], source: ["simulation"],
      fetched_at: new Date().toLocaleTimeString(), live: false, errors: []
    };
  }

  function stationColor(station) {
    if (station.lines.length > 1) return "#e8e6dc";
    return layout.colors[station.lines[0]];
  }

  function stationSeverity(station, status) {
    let severity = status.stations[station.name] || 0;
    station.lines.forEach(line => {
      severity = Math.max(severity, status.lines[line] || 0);
    });
    return severity;
  }

  function applyTrainLevels(status, trains) {
    document.querySelectorAll(".led").forEach((circle, index) => {
      const station = layout.stations[index];
      const severity = stationSeverity(station, status);
      const trainLevel = trains?.levels?.[index] || 0;
      const hasTrain = severity === 0 && trainLevel > 0.02;
      circle.classList.toggle("train", hasTrain);
      circle.style.opacity = trains && severity === 0
        ? (hasTrain ? String(0.12 + 0.88 * trainLevel) : "0")
        : "1";
      circle.dataset.trainLevel = String(trainLevel);
      const trainText = hasTrain
        ? `, présence théorique ${Math.round(trainLevel * 100)} %`
        : "";
      circle.setAttribute(
        "aria-label", `${station.name}, ${stateLabels[severity]}${trainText}`
      );
    });
  }

  function animatedLevels(trains, elapsedSeconds) {
    const levels = Array(layout.stations.length).fill(0);
    trains.trains.forEach(train => {
      const duration = Math.max(1, train.segment_duration || 1);
      const progress = Math.max(
        0,
        Math.min(1, train.progress + elapsedSeconds / duration)
      );
      if (train.from === train.to) {
        levels[train.from] = 1;
      } else {
        const markerStation = progress < 0.5 ? train.from : train.to;
        levels[markerStation] = 1;
      }
    });
    return levels;
  }

  function runLiveAnimation(now) {
    if (
      document.getElementById("mode").value === "live"
      && liveStatus
      && liveTrains
      && layout
    ) {
      const elapsedSeconds = Math.max(0, (now - liveTrainAnchorMs) / 1000);
      applyTrainLevels(
        liveStatus,
        {...liveTrains, levels: animatedLevels(liveTrains, elapsedSeconds)}
      );
    }
    liveAnimationFrame = requestAnimationFrame(runLiveAnimation);
  }

  function render(status, trains = null) {
    clearInterval(testTimer);
    cancelAnimationFrame(nightAnimationFrame);
    cancelAnimationFrame(systemAnimationFrame);
    document.body.classList.remove("night-preview");
    document.querySelectorAll(".led").forEach((circle, index) => {
      const station = layout.stations[index];
      const severity = stationSeverity(station, status);
      const stationStopped = (status.stations[station.name] || 0) === 2;
      const lineStopped = station.lines.some(line => status.lines[line] === 2);
      circle.classList.toggle("slow", severity === 1);
      circle.classList.toggle("stopped-line", lineStopped);
      circle.classList.toggle(
        "stopped-station",
        stationStopped && !lineStopped
      );
      circle.style.fill = severity === 1 ? "#ff8a00" : stationColor(station);
      circle.style.color = circle.style.fill;
      circle.dataset.severity = String(severity);
    });
    applyTrainLevels(status, trains);

    const statuses = document.getElementById("line-statuses");
    statuses.replaceChildren();
    Object.keys(lineLabels).forEach(line => {
      const severity = status.lines[line] || 0;
      const item = document.createElement("span");
      item.className = "line-state";
      item.dataset.severity = String(severity);
      const count = severity === 2 ? 0 : trains?.counts?.[line];
      item.textContent = count === undefined
        ? `${lineLabels[line]} : ${stateLabels[severity]}`
        : `${lineLabels[line]} : ${count} trains · ${stateLabels[severity]}`;
      statuses.appendChild(item);
    });

    if (trains) {
      const alertSource = status.source.length
        ? `alertes ${status.source.join(" + ")}`
        : "alertes non connectées";
      document.getElementById("meta").textContent =
        `Style Metroboard · ${trains.train_count} trains estimés · ` +
        `${trains.fetched_at.slice(11)} · ${alertSource}`;
    } else {
      const source = status.source.length
        ? status.source.join(" + ")
        : "simulation locale";
      document.getElementById("meta").textContent =
        `Simulation · ${source} · ${status.fetched_at}`;
    }

    const messages = document.getElementById("messages");
    messages.replaceChildren();
    const trainMessages = trains
      ? [
          trains.disclaimer,
          trains.attribution,
          ...(trains.feed_current ? [] : [
            `Horaire GTFS expiré le ${trains.feed_end}; une mise à jour est requise.`
          ])
        ]
      : [];
    [
      ...trainMessages,
      ...(status.messages || []),
      ...(status.errors || [])
    ].forEach(text => {
      const paragraph = document.createElement("p");
      paragraph.textContent = text;
      messages.appendChild(paragraph);
    });
  }

  function runNightAnimation() {
    cancelAnimationFrame(nightAnimationFrame);
    document.body.classList.add("night-preview");
    const startedAt = performance.now();
    const periodMs = 18000;

    function animate(now) {
      if (document.getElementById("mode").value !== "night") return;
      const phase = 2 * Math.PI * ((now - startedAt) % periodMs) / periodMs;
      const breath = (Math.sin(phase - Math.PI / 2) + 1) / 2;
      const actualBrightness = 0.001125 + 0.003375 * breath;
      // L'opacité reste amplifiée à l'écran, mais reflète le nouveau mode
      // nocturne beaucoup plus discret du cadre physique.
      const previewOpacity = 0.02 + 0.12 * breath;

      document.querySelectorAll(".led").forEach(circle => {
        if (circle.dataset.severity === "0") {
          circle.style.opacity = String(previewOpacity);
        }
      });
      document.getElementById("meta").textContent =
        "Mode nuit · respiration de 18 s · " +
        `${(actualBrightness * 100).toFixed(1)} % réel ` +
        "(amplifié à l’écran)";
      nightAnimationFrame = requestAnimationFrame(animate);
    }

    nightAnimationFrame = requestAnimationFrame(animate);
  }

  const systemDescriptions = {
    boot: "Mise sous tension · un point blanc vérifie les 68 DEL",
    "line-test": "Vérification successive des quatre lignes",
    "wifi-connect": "Connexion Wi-Fi · chenillard cyan",
    "wifi-connected": "Wi-Fi connecté · double impulsion cyan",
    "clock-sync": "Synchronisation de l’heure · quatre repères blancs",
    "schedule-loading": "Chargement de l’horaire GTFS",
    ready: "Système prêt · révélation des quatre lignes",
    "config-error": "Configuration invalide · motif magenta long-court-court",
    "wifi-unavailable": "Aucun Wi-Fi accessible · respiration cyan",
    "wifi-reconnecting": "Wi-Fi perdu · tentative discrète toutes les 10 s",
    "gtfs-expired": "Horaire expiré · double balayage ambre toutes les 30 s",
    "api-stale": "API STM inaccessible · double repère cyan",
    "gtfs-updating": "Téléchargement d’un nouvel horaire",
    "gtfs-update-success": "Mise à jour réussie · ouverture blanche",
    "gtfs-update-error": "Échec de mise à jour · magenta et ambre",
    "power-limited": "Protection électrique active · triple signal ambre",
    "fatal-error": "Erreur fatale · magenta-blanc-magenta",
    "orange-recovery": "Reprise du service · balayage orange unique"
  };

  function runSystemAnimation(state) {
    render(emptyStatus());
    cancelAnimationFrame(systemAnimationFrame);
    const startedAt = performance.now();
    const colors = {
      white: "#e8e6dc", cyan: "#00c8ff", magenta: "#e000a0",
      amber: "#ff8a00"
    };
    const circles = [...document.querySelectorAll(".led")];
    const count = circles.length;

    function animate(now) {
      if (document.getElementById("mode").value !== state) return;
      const elapsed = Math.max(0, now - startedAt);
      const frame = Array(count).fill(null);
      const put = (index, color, opacity = 1) => {
        if (index >= 0 && index < count) frame[index] = {color, opacity};
      };
      const comet = (position, color, reverse = false) => {
        let head = ((Math.floor(position) % count) + count) % count;
        if (reverse) head = count - 1 - head;
        const direction = reverse ? 1 : -1;
        put(head, color, 1);
        put((head + direction + count) % count, color, .38);
        put((head + 2 * direction + count) % count, color, .14);
      };
      const anchors = [0, Math.floor(count / 2), count - 1];
      const pulse = (period, windows) => {
        const phase = elapsed % period;
        return windows.some(([start, end]) => phase >= start && phase < end);
      };

      if (state === "boot") comet(elapsed / 40, colors.white);
      else if (state === "wifi-connect") comet(elapsed / 75, colors.cyan);
      else if (state === "wifi-reconnecting") {
        if (elapsed % 10000 < 1800) comet((elapsed % 10000) / 70, colors.cyan);
      } else if (state === "wifi-connected") {
        if (pulse(1200, [[0, 180], [360, 540]])) {
          frame.fill({color: colors.cyan, opacity: 1});
        }
      } else if (state === "clock-sync") {
        const head = Math.floor(elapsed / 120) % count;
        for (let offset = 0; offset < count; offset += Math.floor(count / 4)) {
          put((head + offset) % count, colors.white);
        }
      } else if (state === "line-test" || state === "schedule-loading") {
        const lines = ["green", "orange", "yellow", "blue"];
        const line = lines[Math.floor(elapsed / 300) % lines.length];
        layout.stations.forEach((station, index) => {
          if (station.lines.includes(line)) put(index, layout.colors[line]);
        });
      } else if (state === "ready") {
        const visible = Math.min(count, Math.floor((elapsed * count) / 1100) + 1);
        for (let index = 0; index < visible; index++) {
          put(index, stationColor(layout.stations[index]));
        }
      } else if (state === "config-error") {
        if (pulse(2600, [[0, 520], [800, 970], [1180, 1350]])) {
          anchors.forEach(index => put(index, colors.magenta));
        }
      } else if (state === "wifi-unavailable") {
        const phase = (elapsed % 2600) / 1300;
        const triangle = phase <= 1 ? phase : 2 - phase;
        frame.fill({color: colors.cyan, opacity: .1 + .28 * triangle});
      } else if (state === "gtfs-expired") {
        const phase = elapsed % 30000;
        if (phase < 1400) {
          const position = phase * count / 1400;
          comet(position, colors.amber);
          comet(position + count / 2, colors.amber);
        }
      } else if (state === "api-stale") {
        if (pulse(30000, [[0, 170], [340, 510]])) {
          put(0, colors.cyan); put(count - 1, colors.cyan);
        }
      } else if (state === "gtfs-updating") {
        const visible = Math.min(count, Math.floor((elapsed % 3000) * count / 3000) + 1);
        for (let index = 0; index < visible; index++) put(index, colors.cyan, .22);
        put(visible - 1, colors.cyan);
      } else if (state === "gtfs-update-success") {
        const center = Math.floor(count / 2);
        const distance = Math.min(center, Math.floor(elapsed * center / 1200));
        put(center - distance, colors.white); put(center + distance, colors.white);
      } else if (state === "gtfs-update-error") {
        if (pulse(2400, [[0, 180], [360, 540]])) {
          put(anchors[0], colors.magenta);
          put(anchors[1], colors.amber);
          put(anchors[2], colors.magenta);
        }
      } else if (state === "power-limited") {
        if (pulse(2400, [[0, 150], [300, 450], [600, 750]])) {
          anchors.forEach(index => put(index, colors.amber));
        }
      } else if (state === "fatal-error") {
        if (pulse(1800, [[0, 500], [760, 1260]])) {
          put(anchors[0], colors.magenta);
          put(anchors[1], colors.white);
          put(anchors[2], colors.magenta);
        }
      } else if (state === "orange-recovery") {
        const indexes = layout.stations
          .map((station, index) => station.lines.includes("orange") ? index : -1)
          .filter(index => index >= 0);
        const position = Math.floor((elapsed % 1600) * indexes.length / 1600);
        put(indexes[Math.min(position, indexes.length - 1)], layout.colors.orange);
      }

      circles.forEach((circle, index) => {
        circle.classList.remove("train", "slow", "stopped-line", "stopped-station");
        const value = frame[index];
        circle.style.fill = value?.color || stationColor(layout.stations[index]);
        circle.style.color = circle.style.fill;
        circle.style.opacity = value ? String(value.opacity) : "0";
      });
      document.getElementById("meta").textContent = systemDescriptions[state];
      systemAnimationFrame = requestAnimationFrame(animate);
    }

    systemAnimationFrame = requestAnimationFrame(animate);
  }

  function demoStatus(mode) {
    const status = emptyStatus();
    if (mode === "green-stop") status.lines.green = 2;
    if (mode === "orange-stop") status.lines.orange = 2;
    if (mode === "orange-slow") status.lines.orange = 1;
    if (mode === "berri-stop") status.stations["Berri-UQAM"] = 2;
    return status;
  }

  function runSequence() {
    const circles = [...document.querySelectorAll(".led")];
    circles.forEach(circle => { circle.style.opacity = "0.08"; });
    let index = 0;
    testTimer = setInterval(() => {
      circles.forEach(circle => { circle.style.opacity = "0.08"; });
      circles[index].style.opacity = "1";
      document.getElementById("detail").textContent =
        `DEL ${index} : ${layout.stations[index].name}`;
      index = (index + 1) % circles.length;
    }, 120);
  }

  async function refresh(force = false) {
    [liveStatus, liveTrains] = await Promise.all([
      fetch(`/api/status${force ? "?force=1" : ""}`)
        .then(response => response.json()),
      fetch("/api/trains").then(response => response.json())
    ]);
    liveTrainAnchorMs = performance.now();
    if (document.getElementById("mode").value === "live") {
      render(liveStatus, liveTrains);
    }
  }

  async function refreshTrains() {
    liveTrains = await fetch("/api/trains").then(response => response.json());
    liveTrainAnchorMs = performance.now();
    if (
      liveStatus
      && document.getElementById("mode").value === "live"
    ) {
      render(liveStatus, liveTrains);
    }
  }

  async function initialize() {
    layout = await fetch("/api/layout").then(response => response.json());
    const group = document.getElementById("leds");
    layout.stations.forEach((station, index) => {
      const socket = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      socket.setAttribute("cx", station.x);
      socket.setAttribute("cy", station.y);
      socket.setAttribute("r", "5.1");
      socket.classList.add("led-socket");
      group.appendChild(socket);

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", station.x);
      circle.setAttribute("cy", station.y);
      circle.setAttribute("r", "4.9");
      circle.classList.add("led");
      circle.addEventListener("click", () => {
        const severity = Number(circle.dataset.severity || 0);
        const trainLevel = Number(circle.dataset.trainLevel || 0);
        const trainText = trainLevel > 0.02
          ? ` · présence théorique ${Math.round(trainLevel * 100)} %`
          : "";
        document.getElementById("detail").textContent =
          `DEL ${index} · ${station.name} · ${stateLabels[severity]}${trainText}`;
      });
      group.appendChild(circle);
    });
    await refresh();
    cancelAnimationFrame(liveAnimationFrame);
    liveAnimationFrame = requestAnimationFrame(runLiveAnimation);
  }

  document.getElementById("mode").addEventListener("change", event => {
    if (event.target.value === "live") render(liveStatus, liveTrains);
    else if (event.target.value === "night") {
      render(emptyStatus());
      runNightAnimation();
      document.getElementById("detail").textContent =
        "La carte respire entre environ 0,1 % et 0,45 % après le dernier train.";
    }
    else if (event.target.value === "test") {
      render(emptyStatus());
      runSequence();
    } else if (event.target.value === "normal") {
      render(demoStatus(event.target.value));
    } else if (systemDescriptions[event.target.value]) {
      runSystemAnimation(event.target.value);
    } else {
      render(demoStatus(event.target.value), liveTrains);
    }
  });
  document.getElementById("refresh").addEventListener("click", () => refresh(true));
  setInterval(() => refresh(false), 60000);
  setInterval(() => refreshTrains(), 1000);
  initialize().catch(error => {
    document.getElementById("meta").textContent = `Erreur : ${error.message}`;
  });
</script>
</body>
</html>
